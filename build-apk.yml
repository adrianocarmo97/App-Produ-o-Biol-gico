name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Copiar leitor de PDF para o app (funciona offline)
        run: |
          cp node_modules/pdfjs-dist/build/pdf.min.js www/
          cp node_modules/pdfjs-dist/build/pdf.worker.min.js www/

      - name: Criar projeto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Gerar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: drone-producao-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
